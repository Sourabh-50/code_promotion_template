apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeprom-backend
  namespace: default
  labels:
    app: codeprom-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codeprom-backend
  template:
    metadata:
      labels:
        app: codeprom-backend
    spec:
      containers:
        - name: codeprom-backend
          image: {{.Values.backend_image}}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: codeprom-backend-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: codeprom-backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
