apiVersion: apps/v1
kind: Deployment
metadata:
  name: CodeProm-3d-frontend
  namespace: default
  labels:
    app: CodeProm-3d-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: CodeProm-3d-frontend
  template:
    metadata:
      labels:
        app: CodeProm-3d-frontend
    spec:
      containers:
        - name: CodeProm-3d-frontend
          # The Harness pipeline will automatically inject the new built image tag here during deployment!
          image: <+artifact.image>
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: CodeProm-3d-frontend-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: CodeProm-3d-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30005
