<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsPilot - Code Promotion UI</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        .ui-overlay { position: absolute; top: 10%; left: 10%; padding: 2rem; background: rgba(0, 0, 0, 0.7); border-radius: 12px; border: 1px solid rgba(0, 255, 128, 0.3); backdrop-filter: blur(10px); }
        h1 { margin: 0 0 10px 0; color: #00ff80; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #cccccc; margin-bottom: 20px; }
        .status-box { display: inline-block; padding: 8px 16px; background: rgba(0, 255, 128, 0.1); color: #00ff80; border-radius: 4px; font-weight: bold; border: 1px solid #00ff80; }
        
        /* The magical variable that determines the globe color! */
        /* Developer Note: Change this to #ff0055 for a red globe during the CI/CD demo */
        :root {
            --globe-color: 0x00ff80; 
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        <h1>OpsPilot Production</h1>
        <p>Advanced CI/CD Automated Deployment System</p>
        <div class="status-box">SYSTEM ONLINE: GREEN</div>
    </div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Change this color variable here for the CI/CD Demo! (0x00ff80 is Green, 0xff0055 is Red)
        const GLOBE_COLOR = 0x00ff80;

        // Create 3D Globe (Wireframe Sphere)
        const geometry = new THREE.SphereGeometry(2, 32, 32);
        const material = new THREE.MeshBasicMaterial({ 
            color: GLOBE_COLOR, 
            wireframe: true,
            transparent: true,
            opacity: 0.6
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Create Core Particle (Solid Sphere inside)
        const coreGeo = new THREE.SphereGeometry(1.5, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: GLOBE_COLOR });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        // Position Camera
        camera.position.z = 5;
        camera.position.x = 2; // Offset to the right

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            // Rotate the globe
            globe.rotation.y += 0.005;
            globe.rotation.x += 0.002;
            
            // Pulse the core
            const scale = 1 + Math.sin(Date.now() * 0.003) * 0.05;
            core.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
